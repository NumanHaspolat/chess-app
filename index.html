<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Azurite</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tiny5+Duo&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="./assets/frost icon.jpg" />
  </head>

  <body>
    <main class="app">
      <section class="board-section">
        <div class="board-wrap">
          <div id="strip-top" class="strip"></div>

          <!-- Chessboard + Evaluation bar -->
          <div class="board-row">
            <div class="evaluation">
              <div id="evaluation-bar" class="evaluation-bar">
                <div id="evaluation-white" class="evaluation-white"></div>
                <div id="evaluation-black" class="evaluation-black"></div>
              </div>
              <div id="evaluation-score" class="evaluation-score">0.0</div>
            </div>

            <div id="board" class="board"></div>
          </div>

          <div id="strip-bottom" class="strip"></div>

          <div
            id="drill-complete-overlay"
            class="drill-complete-overlay"
            hidden
          >
            <div class="drill-complete-card">
              <h2>Line Complete!</h2>
              <p id="drill-complete-stats"></p>

              <div class="drill-complete-buttons">
                <button id="btn-drill-continue">Continue</button>
                <button id="btn-drill-stop">Stop Drill</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="moves-section">
        <h2>Moves</h2>
        <div id="status" class="status"></div>
        <div id="opening" class="opening"></div>

        <div class="buttons">
          <button id="btn-undo">Undo</button>
          <button id="btn-flip">Flip</button>
          <button id="btn-reset">Reset</button>
        </div>

        <ol id="moves" class="moves"></ol>
      </section>

      <aside class="repertoire-section">
        <div class="library-header">
          <h2>My Repertoires</h2>
          <span id="rep-count">0 saved</span>
        </div>

        <div id="rep-library" class="rep-library"></div>

        <button id="btn-import-rep" class="import-rep-btn">
          + Import new PGN
        </button>

        <div id="rep-details" class="rep-details">
          <div id="rep-info" class="rep-info"></div>

          <button id="btn-drill" class="drill-btn" hidden>
            Train this repertoire
          </button>

          <div id="rep-turn" class="rep-turn"></div>
          <button id="btn-drill-action" class="drill-action" hidden></button>

          <div id="rep-next" class="rep-next"></div>
          <div id="rep-comment" class="rep-comment"></div>
          <div id="drill-alternatives" class="drill-alternatives" hidden></div>
        </div>

        <input id="pgn-file" type="file" accept=".pgn,.txt" hidden />

        <div id="rep-notice" class="rep-notice"></div>
      </aside>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
